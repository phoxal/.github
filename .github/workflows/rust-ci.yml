# Reusable CI workflow for Phoxal Rust repos.
#
# Runs fmt, clippy, test (and optionally rustdoc) as parallel jobs with
# locked dependency resolution. Called (not inherited) by a repo's local
# `ci.yml` wrapper:
#
#   name: ci
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: phoxal/.github/.github/workflows/rust-ci.yml@main
#       with: { test-args: "--exclude native-fixture" }
#
# Repos whose build needs extra system libraries pass them via
# `system-packages` (e.g. `with: { system-packages: "libssl-dev nasm" }`).
# Tests that need a simulator installation, real hardware, or a host
# fixture are excluded here and run as explicitly recorded acceptance
# commands instead — CI never carries a knowingly-failing suite.
name: rust-ci

on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain to install.
        type: string
        default: stable
      system-packages:
        description: Space-separated apt packages to install before building (for -sys crates).
        type: string
        default: ""
      test-args:
        description: Extra cargo test arguments (e.g. "--exclude a-package").
        type: string
        default: ""
      rustdoc:
        description: Run a strict rustdoc job (`cargo doc --no-deps -- -D warnings`).
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          set -euo pipefail
          read -ra pkgs <<< "$SYSTEM_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          set -euo pipefail
          read -ra pkgs <<< "$SYSTEM_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - run: cargo test --workspace --locked --no-fail-fast ${{ inputs.test-args }}

  rustdoc:
    if: ${{ inputs.rustdoc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rust-docs
      - run: cargo doc --workspace --no-deps --locked --document-private-items -- -D warnings
