# Reusable CI workflow for Phoxal Rust repos.
#
# Runs fmt, clippy, and test as three parallel jobs, so the workspace is
# type-checked and built concurrently instead of compiled twice back-to-back in
# a single serial job (clippy and `cargo test` don't share artifacts). Called
# (not inherited) by a repo's local `ci.yml` wrapper:
#
#   name: ci
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: phoxal/.github/.github/workflows/rust-ci.yml@main
#       secrets: inherit
#
# Repos whose build needs extra system libraries pass them via `system-packages`
# (e.g. `with: { system-packages: "libssl-dev nasm" }`).
#
# Repos containing a Webots controller pass `webots-version` (e.g.
# `with: { webots-version: R2025a }`). Webots is a build prerequisite there, not
# a runtime one: webots-rs links libController from the installation, so even
# `cargo check` fails without it.
name: rust-ci

on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain to install.
        type: string
        default: stable
      system-packages:
        description: Space-separated apt packages to install before building (for -sys crates).
        type: string
        default: ""
      webots-version:
        description: Webots release to install before building (e.g. R2025a); empty installs nothing.
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          set -euo pipefail
          read -ra pkgs <<< "$SYSTEM_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - name: Cache Webots download
        if: ${{ inputs.webots-version != '' }}
        id: cache-webots
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webots.tar.bz2
          key: webots-${{ inputs.webots-version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download Webots
        if: ${{ inputs.webots-version != '' && steps.cache-webots.outputs.cache-hit != 'true' }}
        env:
          WEBOTS_VERSION: ${{ inputs.webots-version }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/cyberbotics/webots/releases/download/${WEBOTS_VERSION}/webots-${WEBOTS_VERSION}-x86-64.tar.bz2" \
            --output "$RUNNER_TEMP/webots.tar.bz2"
      - name: Install Webots
        if: ${{ inputs.webots-version != '' }}
        run: |
          set -euo pipefail
          tar -xjf "$RUNNER_TEMP/webots.tar.bz2" -C "$RUNNER_TEMP"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Install system packages
        if: ${{ inputs.system-packages != '' }}
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          set -euo pipefail
          read -ra pkgs <<< "$SYSTEM_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - name: Cache Webots download
        if: ${{ inputs.webots-version != '' }}
        id: cache-webots
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/webots.tar.bz2
          key: webots-${{ inputs.webots-version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download Webots
        if: ${{ inputs.webots-version != '' && steps.cache-webots.outputs.cache-hit != 'true' }}
        env:
          WEBOTS_VERSION: ${{ inputs.webots-version }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/cyberbotics/webots/releases/download/${WEBOTS_VERSION}/webots-${WEBOTS_VERSION}-x86-64.tar.bz2" \
            --output "$RUNNER_TEMP/webots.tar.bz2"
      - name: Install Webots
        if: ${{ inputs.webots-version != '' }}
        run: |
          set -euo pipefail
          tar -xjf "$RUNNER_TEMP/webots.tar.bz2" -C "$RUNNER_TEMP"
          echo "WEBOTS_HOME=$RUNNER_TEMP/webots" >> "$GITHUB_ENV"
      - run: cargo test --workspace
