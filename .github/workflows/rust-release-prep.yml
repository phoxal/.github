# Reusable release-prep workflow for Phoxal Rust repos.
#
# Called (not inherited) by a repo's local `release-prep.yml` wrapper:
#
#   jobs:
#     prepare:
#       uses: phoxal/.github/.github/workflows/rust-release-prep.yml@main
#       secrets: inherit
#
# On every push to the default branch it computes the next semver from
# conventional commits since the last tag, bumps Cargo.toml + regenerates
# CHANGELOG.md, and opens a `chore(release): vX.Y.Z` PR. Merging that PR is
# what triggers the repo's `release.yml`. It deliberately skips its own
# release-prep merge so it never loops.
#
# Exactly 0 or 1 release PR is open at any time. Each computed version lives on
# its own `release/vX.Y.Z` branch, so a later push computing a *higher*
# cumulative version would otherwise open a second PR alongside the first. To
# enforce the invariant, the workflow supersedes stale release PRs: before
# opening the PR for the current version it closes (and deletes the branch of)
# every other open `release/*` PR. The newest computed version always wins.
#
# Who opens the PR (token precedence): a PR opened with GITHUB_TOKEN never
# triggers `pull_request` CI (GitHub's recursion guard), so the release PR stalls
# behind the first-time-contributor approval gate ("Approve and run"). To avoid
# that, author the PR with a different identity. The token is picked in order:
#
#   1. RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY — a Phoxal-owned GitHub App
#      installation (Contents + Pull requests: read/write). Best long-term:
#      org-owned, short-lived token, not tied to a person.
#   2. RELEASE_TOKEN — a fine-grained PAT (Contents + Pull requests: read/write).
#      Simplest to set up; the PR is authored by whoever owns the PAT.
#   3. GITHUB_TOKEN — fallback when neither is set. PR still opens, but CI must
#      be approved manually.
#
# Set any of these as org (or repo) secrets; `secrets: inherit` passes them in.
name: rust-release-prep

on:
  workflow_call:
    inputs:
      default-branch:
        description: Branch the release-prep PR targets.
        type: string
        default: main
      git-cliff-version:
        description: git-cliff version used to regenerate CHANGELOG.md.
        type: string
        default: "2.7.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      # Empty unless the release-app secrets are configured; the steps below
      # then fall back to GITHUB_TOKEN.
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      # Mint a short-lived installation token for the Phoxal release GitHub App
      # so the release-prep PR is authored by a machine identity other than
      # GITHUB_TOKEN. PRs opened with GITHUB_TOKEN never trigger `pull_request`
      # CI, leaving the release PR stuck behind the first-time-contributor
      # approval gate; an App token sidesteps that.
      - name: Mint release-app token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2
        with:
          version: ${{ inputs.git-cliff-version }}

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail
          # Self-trigger guard: never react to our own release-prep merge.
          # Merging a release-prep PR is a push to the default branch and would
          # otherwise re-run this workflow. Covers squash/rebase merges (HEAD
          # subject is the release-prep commit) and merge-commit merges (the
          # subject shows up among the commits introduced by this push).
          before="${{ github.event.before }}"
          if [ -n "${before}" ] && [ "${before}" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse -q --verify "${before}^{commit}" >/dev/null 2>&1; then
            pushed_subjects=$(git log --format='%s' "${before}..${{ github.sha }}")
          else
            pushed_subjects=$(git log -1 --format='%s')
          fi
          if printf '%s\n' "${pushed_subjects}" | grep -qE '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "This push contains a release-prep commit; release.yml owns it. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_tag=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          current_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if ! git rev-parse "v${current_version}" >/dev/null 2>&1 && [ "${current_version}" != "${last_tag#v}" ]; then
            echo "Cargo.toml is at ${current_version} which is not yet tagged; release.yml is likely in flight. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commits=$(git log --format="%s%n%n%b" "${last_tag}..HEAD" 2>/dev/null || git log --format="%s%n%n%b")
          if echo "$commits" | grep -qE "^[a-z]+(\([^)]+\))?!:" || echo "$commits" | grep -qE "^BREAKING CHANGE:"; then
            bump="major"
          elif echo "$commits" | grep -qE "^feat(\([^)]+\))?:"; then
            bump="minor"
          elif echo "$commits" | grep -qE "^fix(\([^)]+\))?:"; then
            bump="patch"
          else
            echo "No bumping commits since ${last_tag}; nothing to propose."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_version="${last_tag#v}"
          base_version="${last_version%%-*}"
          IFS='.' read -r major minor patch <<< "$base_version"
          # Semver pre-1.0: a breaking change at 0.x bumps the minor, not to 1.0.0.
          # Graduating to 1.0.0 is a deliberate manual release, never automatic.
          if [ "$major" -eq 0 ] && [ "$bump" = "major" ]; then
            bump="minor"
          fi
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new_version="${major}.${minor}.${patch}"
          {
            echo "version=${new_version}"
            echo "bump=${bump}"
            echo "last_tag=${last_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml workspace version
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # Bump the package/workspace version AND every internal path-based dependency
          # pin to the new version. crates.io requires a path dep to also carry a
          # version; if a pin is left behind, the bumped member no longer satisfies its
          # own `^old` requirement and the next step's `cargo update --workspace` fails
          # to resolve it (which blocked releases the moment new publishable members
          # were added before their first publish). Only inline-table deps containing a
          # `path =` are touched (local members); external deps and path deps without a
          # version pin are left as-is.
          python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["NEW_VERSION"]
          p = pathlib.Path("Cargo.toml")
          t = p.read_text()
          # The sole top-level `version = "..."` line (the `[package]` or
          # `[workspace.package]` version; anchored so an array field before it, or a
          # dependency's inline version, is never matched).
          t = re.sub(r'^version = "[^"]+"', 'version = "' + ver + '"', t, count=1, flags=re.M)
          # Internal path-based dependency pins (any inline table carrying a `path =`).
          t = re.sub(
              r'\{[^{}\n]*\bpath\s*=\s*"[^"]+"[^{}\n]*\}',
              lambda m: re.sub(r'version\s*=\s*"[^"]+"', 'version = "' + ver + '"', m.group(0)),
              t)
          p.write_text(t)
          PY

      - name: Set up Rust
        if: steps.bump.outputs.skip != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Sync Cargo.lock to the bumped version
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Bump the workspace crates' entries in Cargo.lock to match the bumped
          # Cargo.toml so the release PR carries a consistent lockfile. --workspace
          # touches only the workspace members, not external deps. Without this the
          # committed Cargo.lock stays a version behind and `--locked` builds (and
          # `cargo install --git`) break.
          cargo update --workspace

      - name: Regenerate CHANGELOG.md
        if: steps.bump.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --tag v${{ steps.bump.outputs.version }} -o CHANGELOG.md

      - name: Write PR body
        if: steps.bump.outputs.skip != 'true'
        run: |
          cat > "$RUNNER_TEMP/release-prep-body.md" <<'BODY'
          Auto-generated by `release-prep`.

          Bumps the workspace version from `${{ steps.bump.outputs.last_tag }}` to **v${{ steps.bump.outputs.version }}** based on the `${{ steps.bump.outputs.bump }}` bump rule (conventional commits since the last tag).

          Merging this PR triggers `release.yml`, which tags `v${{ steps.bump.outputs.version }}`, builds artifacts, and publishes the GitHub Release.

          Review the bump version and the updated `CHANGELOG.md` below before merging.

          ## Changelog preview
          BODY
          # Only the section for the version being released, not the whole file.
          # git-cliff emits a `# Changelog` preamble followed by one `## [x.y.z]`
          # block per version; print from the first version heading up to (but
          # excluding) the next one.
          awk '/^## \[/ { n++ } n == 1 { print } n == 2 { exit }' CHANGELOG.md \
            >> "$RUNNER_TEMP/release-prep-body.md"

      - name: Supersede stale release PRs
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          KEEP: release/v${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # Enforce the 0-or-1 invariant. The version bump lives on the PR
          # branch, never on the default branch, so the "release in flight"
          # guard above can't see an already-open release PR. Close every other
          # open release/* PR (and delete its branch) before opening the current
          # one; the newest computed version supersedes the rest. The current
          # version's own PR (KEEP) is left alone so create-pull-request updates
          # it in place.
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | select(.headRefName != env.KEEP) | .number' \
          | while read -r n; do
              [ -n "$n" ] || continue
              echo "Superseding stale release PR #$n"
              gh pr close "$n" --delete-branch \
                --comment "Superseded by the release-prep PR for v${{ steps.bump.outputs.version }} (only 0 or 1 release PR is kept open)."
            done

      - name: Open release-prep PR
        if: steps.bump.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): v${{ steps.bump.outputs.version }}"
          title: "chore(release): v${{ steps.bump.outputs.version }}"
          body-path: ${{ runner.temp }}/release-prep-body.md
          branch: release/v${{ steps.bump.outputs.version }}
          base: ${{ inputs.default-branch }}
          delete-branch: true
          signoff: true
