# Standard release-plz PR generation. The caller owns scheduling and release authority.
name: rust-release-plz-pr
on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml
      config:
        type: string
        default: release-plz.toml
permissions:
  contents: write
  pull-requests: write
jobs:
  release-plz-pr:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate release App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: ${{ inputs.manifest-path }}
          config: ${{ inputs.config }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
